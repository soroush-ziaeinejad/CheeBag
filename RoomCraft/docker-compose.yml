# RoomCraft: run everything from RoomCraft/ with `docker compose up -d --build`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: roomcraft
      POSTGRES_PASSWORD: roomcraft
      POSTGRES_DB: roomcraft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      # run once, only when the database volume is empty: create tables, then load the CSVs
      - ./data/postgreSQL/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/postgreSQL/load.sql:/docker-entrypoint-initdb.d/02_load.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U roomcraft -d roomcraft"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    environment:
      DB_HOST: postgres
      DB_NAME: roomcraft
      DB_USER: roomcraft
      DB_PASSWORD: roomcraft
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app   # code changes reload without rebuilding
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
