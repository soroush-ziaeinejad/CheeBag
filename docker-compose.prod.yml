# Chideman AI, production: `docker compose -f docker-compose.prod.yml up -d --build`
name: chideman-prod
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chideman
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: chideman
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      # run once, only when the database volume is empty: create tables, then load the CSVs
      - ./data/postgreSQL/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/postgreSQL/load.sql:/docker-entrypoint-initdb.d/02_load.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chideman -d chideman"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    command: sh -c "python manage.py collectstatic --noinput &&
             exec gunicorn chideman.wsgi:application
             --bind 0.0.0.0:8000 --workers 2"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?required}
      DJANGO_ALLOWED_HOSTS: "54.221.38.43,localhost,127.0.0.1"
      DB_HOST: postgres
      DB_NAME: chideman
      DB_USER: chideman
      DB_PASSWORD: ${DB_PASSWORD}
      AGENT_URL: http://agent:8000   # Django forwards chat messages here
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./frontend:/app   # code changes reload without rebuilding
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  store-api:

    build: ./store_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://chideman:${DB_PASSWORD}@postgres:5432/chideman
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: ./agent
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
        STORE_API_URL: http://store-api:8000
    env_file:
      - path: .env
        required: false   # the service still starts without it; /chat then returns 502
    depends_on:
      - store-api

volumes:
  pgdata:
