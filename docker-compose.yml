# CheeBag, local development: run from the project folder with `docker compose up -d --build`
name: cheebag
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cheebag
      POSTGRES_PASSWORD: cheebag #${DB_PASSWORD:-cheebag}
      POSTGRES_DB: cheebag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      # run once, only when the database volume is empty: create tables, then load the CSVs
      - ./data/postgreSQL/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/postgreSQL/load.sql:/docker-entrypoint-initdb.d/02_load.sql:ro
      - ./data/postgreSQL/migrations/001_actions.sql:/docker-entrypoint-initdb.d/03_actions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cheebag -d cheebag"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "True"
      DB_HOST: postgres
      DB_NAME: cheebag
      DB_USER: cheebag
      DB_PASSWORD: cheebag #${DB_PASSWORD:-cheebag}
      AGENT_URL: http://agent:8000   # Django forwards chat messages here
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app   # code changes reload without rebuilding
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  store-api:
    build: ./store_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://cheebag:cheebag@postgres:5432/cheebag
    ports:
      - "8001:8000"
    volumes:
      - ./store_api:/app   # code changes reload without rebuilding
      - ./data/policies:/policies:ro   # seller cancellation rules (policy_facts.json)
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: ./agent
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
        STORE_API_URL: http://store-api:8000
    env_file:
      - path: .env
        required: false   # the service still starts without it; /chat then returns 502
    ports:
      - "8002:8000"
    volumes:
      - ./agent:/app   # code changes reload without rebuilding
    depends_on:
      - store-api

  room-studio:
    build: ./room_studio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      STORE_API_URL: http://store-api:8000
    env_file:
      - path: .env
        required: false   # ANTHROPIC_API_KEY; GEMINI_API_KEY for real AI previews; SERPAPI_KEY for online shops
    ports:
      - "8003:8000"
    volumes:
      - ./room_studio:/app   # code changes reload without rebuilding
      - studio_data:/data    # room photos and previews, deleted after 6 hours
    depends_on:
      - store-api

volumes:
  pgdata:
  studio_data:
